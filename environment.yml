name: ra
channels:
  - conda-forge
  - pytorch
  - fastai
  - bioconda
  - defaults
dependencies:
  # Python core
  - python=3.10 # keeping your preferred version
  
  # Computer vision and image processing
  - opencv
  - pillow
  - scikit-image
  
  # Scientific computing
  - numpy
  - scipy
  - matplotlib
  - seaborn
  - pandas
  - scikit-learn
  
  # Web frameworks and UI
  - gradio==4.44.1
  - streamlit
  - streamlit-drawable-canvas
  
  # Bioinformatics core
  - biopython
  - scanpy
  - pydeseq2
  - anndata
  - leidenalg
  
  # File handling and data processing
  - PyPDF2
  - PyYAML
  - requests
  - beautifulsoup4
  - igraph
  - joblib
  
  # Development and testing tools
  - pytest>=7.0.0
  - pytest-cov>=4.0.0
  - pytest-mock>=3.8.0
  - pytest-asyncio>=0.19.0
  - black>=22.0.0
  - isort>=5.0.0
  - flake8>=5.0.0
  - mypy>=0.991
  - pre-commit>=2.20.0
  - bandit>=1.7.0
  - coverage>=6.0.0
  
  # Jupyter ecosystem
  - jupyter
  - ipykernel
  
  # Node.js for React development (keeping existing)
  - nodejs
  - npm
  
  # Pip packages
  - pip
  - pip:
      # Core data science
      - readlif
      - plotly-express
      - gprofiler-official
      
      # AI/ML APIs
      - openai
      - spacy
      
      # Cloud services
      - boto3
      - botocore
      - azure-identity
      - azure-mgmt-resource
      
      # MCP and server framework (CRITICAL - preserving existing)
      - mcp
      - fastapi
      - uvicorn
      - pydantic
      - httpx
      - websockets
      - aiofiles
      - aiocache
      - python-dotenv
      - asyncio-mqtt
      - jsonschema
      - aiohttp
      
      # System monitoring and logging
      - structlog
      - psutil
      - GPUtil
